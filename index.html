<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص المضيف - بايثون</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; margin-top: 50px; background-color: #1a1a1a; color: white; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 12px; display: inline-block; width: 90%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 6px; border: none; box-sizing: border-box; width: 100%; }
        input { background-color: #3d3d3d; color: #fff; border: 1px solid #008cba; text-align: left; direction: ltr; }
        button { background-color: #008cba; color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #007095; }
        #result { margin-top: 25px; font-size: 28px; font-weight: bold; padding: 10px; border-radius: 8px; display: none; }
        .error { color: #ff4c4c; background-color: rgba(255, 76, 76, 0.1); display: block !important; }
        .success { color: #4CAF50; background-color: rgba(76, 175, 80, 0.1); display: block !important; }
        .loading { color: #008cba; display: block !important; }
        #details { margin-top: 15px; font-size: 14px; color: #aaa; text-align: left; direction: ltr; }
    </style>
</head>
<body>
    <div class="container">
        <h2>فاحص حالة التطبيق (Render/Python)</h2>
        <input type="text" id="urlInput" value="mobile4.bok-sd.com:3443" placeholder="أدخل الدومين والمنفذ...">
        <button onclick="checkHost()">تحقق (Socket Connect)</button>
        
        <div id="result"></div>
        <div id="details"></div>
    </div>

    <script>
        async function checkHost() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            const detailsDiv = document.getElementById('details');

            resultDiv.innerHTML = "جاري الفحص...";
            resultDiv.className = "loading";
            detailsDiv.innerHTML = "";

            try {
                const response = await fetch('/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'url=' + encodeURIComponent(url)
                });
                
                const data = await response.json();

                resultDiv.innerHTML = data.message;
                resultDiv.className = data.status; 
                detailsDiv.innerHTML = data.details;

            } catch (error) {
                resultDiv.innerHTML = "خطأ في النظام";
                resultDiv.className = "error";
                detailsDiv.innerHTML = "حدث خطأ أثناء معالجة الطلب.";
            }
        }
    </script>
</body>
</html>
